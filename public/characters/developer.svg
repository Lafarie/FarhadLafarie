    <style>
      .draw-line { stroke-linecap: round; stroke-linejoin: round; }
      .tech-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.05em; }

      /* === GROUNDED SENSE-MAKING HARDWARE AND IDE ANIMATIONS === */
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes codeTypeFlow {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 16; }
      }
      @keyframes devLedBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes visorGlowDev {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }

      .anim-cursor { animation: cursorBlink 0.9s steps(1) infinite; }
      .anim-code-type { stroke-dasharray: 24 8; animation: codeTypeFlow 3s ease-in-out infinite; }
      .anim-dev-led { animation: devLedBlink 1.2s infinite; }
      .anim-visor-dev { animation: visorGlowDev 2.8s ease-in-out infinite; }
    </style>
  </defs>

