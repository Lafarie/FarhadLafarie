    <pattern id="ink-hatch-dev-dense" width="4" height="4" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#18181b" stroke-width="0.75" opacity="0.2"/>
