    <pattern id="dev-hatch-dense" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#7c3aed" stroke-width="0.8" opacity="0.3"/>
